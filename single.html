    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            let urlstring = window.location.search
            let urlsParams = new URLSearchParams(urlstring)
            let id = urlsParams.get("id")
            let allStudents = Products.find(i => i.id == id)
            if (!allStudents) {
                document.querySelector(".ism").textContent = "Ma'lumot topilmadi"
                return
            }

            document.querySelector(".rasmcha").src = allStudents.rasm 
            document.querySelector(".ism").textContent = `Familya:${allStudents.fio}`
            document.querySelector(".kurs").textContent = `Kursi:${allStudents.kursi}` 
            document.querySelector(".talyun").textContent = `Ta'lim yo'nalishi: ${allStudents.Talim_yonalishi || "Kiritilmagan"}`
            document.querySelector(".sefrraqam").textContent = `Sertifikat raqami:${allStudents.sefrraqam}` 
            document.querySelector(".sefrsan").textContent = `Sertifikat sanasi: ${allStudents.Sertifikat_sanasi}`
            document.querySelector(".tugyil").textContent = `Tugilgan yili: ${allStudents.Tugilgan_yili}`
